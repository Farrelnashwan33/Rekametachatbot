name = "rekametachatbot"
main = "frontend/.svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm --prefix frontend install && npm --prefix frontend run build"

[assets]
binding = "ASSETS"
directory = "frontend/.svelte-kit/cloudflare"

[vars]
PUBLIC_APP_NAME = "Rekametachat"

